# Canonical Dependabot config for a Node-based QuadriviumPress book repo
# (MyST, Eleventy). Copy to .github/dependabot.yml in the member repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
