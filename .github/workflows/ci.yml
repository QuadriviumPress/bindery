# Reusable CI workflow for QuadriviumPress book repos. Builds the book on
# every pull request so a broken conversion never reaches main. Node/Python
# toolchains are auto-detected from the caller's checkout; only the build
# command has to be told what to run, since it differs by format (myst,
# eleventy, ...).
name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      python-version:
        type: string
        default: "3.12"
      install-command:
        description: Defaults to "npm ci" when a package-lock.json is present.
        type: string
        default: ""
      build-command:
        type: string
        default: "npm run build"
      pre-build-command:
        description: Optional command to run after install, before build (e.g. a conversion/verification script).
        type: string
        default: ""
      run-tests:
        description: Run "npm test" when the caller's package.json defines a test script.
        type: boolean
        default: true
      install-hunspell:
        description: Install hunspell + hunspell-en-us before building (spell-checked MyST builds).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect toolchains
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_node=true" >> "$GITHUB_OUTPUT"; else echo "has_node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "has_python=true" >> "$GITHUB_OUTPUT"; else echo "has_python=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.has_python == 'true'
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install hunspell
        if: inputs.install-hunspell
        run: sudo apt-get update && sudo apt-get install -y hunspell hunspell-en-us

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Install Node dependencies
        if: steps.detect.outputs.has_node == 'true'
        run: ${{ inputs.install-command || 'npm ci' }}

      - name: Expose local node CLIs on PATH
        if: steps.detect.outputs.has_node == 'true'
        run: echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pre-build step
        if: inputs.pre-build-command != ''
        run: ${{ inputs.pre-build-command }}

      - name: Run tests
        if: inputs.run-tests && steps.detect.outputs.has_node == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No 'test' script in package.json -- skipping."
          fi

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## CI build summary"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| **Build** | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Triggered by** | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
