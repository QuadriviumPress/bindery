# Reusable GitHub Pages deploy workflow for QuadriviumPress book repos.
# output-dir varies by format (MyST: _build/html, Eleventy: _site, Jekyll:
# _site) so callers must set it explicitly; see structure/repos.json's
# build.outputDir for each repo.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        default: ""
      build-command:
        type: string
        default: "npm run build"
      pre-build-command:
        type: string
        default: ""
      output-dir:
        description: Directory to publish to Pages (required).
        type: string
        required: true
      install-hunspell:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Detect toolchains
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_node=true" >> "$GITHUB_OUTPUT"; else echo "has_node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "has_python=true" >> "$GITHUB_OUTPUT"; else echo "has_python=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_python == 'true'
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install hunspell
        if: inputs.install-hunspell
        run: sudo apt-get update && sudo apt-get install -y hunspell hunspell-en-us

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Install Node dependencies
        if: steps.detect.outputs.has_node == 'true'
        run: ${{ inputs.install-command || 'npm ci' }}

      - name: Pre-build step
        if: inputs.pre-build-command != ''
        run: ${{ inputs.pre-build-command }}

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.output-dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
