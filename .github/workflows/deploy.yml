# Reusable GitHub Pages deploy workflow for QuadriviumPress book repos.
# output-dir varies by format (MyST: _build/html, Eleventy: _site) so
# callers must set it explicitly; see structure/repos.json's
# build.outputDir for each repo.
#
# Optional hooks cover the MyST “capability profiles” without forking the
# workflow: pre/post-build commands, Typst for PDF exports, notebook kernels,
# and longer timeouts for export-heavy books.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        default: ""
      build-command:
        type: string
        default: "npm run build"
      pre-build-command:
        type: string
        default: ""
      post-build-command:
        description: Optional command after the main build (PWA polish, copy exports, summaries).
        type: string
        default: ""
      output-dir:
        description: Directory to publish to Pages (required).
        type: string
        required: true
      install-hunspell:
        type: boolean
        default: false
      setup-typst:
        description: Install Typst for PDF export builds.
        type: boolean
        default: false
      typst-version:
        type: string
        default: "latest"
      install-ipykernel:
        description: Register a user ipykernel named python3 (executable notebook books).
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout for the build half of deploy.
        type: number
        default: 30
      node-options:
        description: Optional NODE_OPTIONS for memory-heavy Myst/Typst builds.
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  # Allow callers to fetch artifacts/releases from prior Exports workflows.
  actions: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      BASE_URL: /${{ github.event.repository.name }}
      NODE_OPTIONS: ${{ inputs.node-options }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Detect toolchains
        id: detect
        run: |
          if [ -f package.json ]; then echo "has_node=true" >> "$GITHUB_OUTPUT"; else echo "has_node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "has_python=true" >> "$GITHUB_OUTPUT"; else echo "has_python=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.has_python == 'true' || inputs.install-ipykernel
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Setup Typst
        if: inputs.setup-typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ inputs.typst-version }}

      - name: Install hunspell
        if: inputs.install-hunspell
        run: sudo apt-get update && sudo apt-get install -y hunspell hunspell-en-us

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Install ipykernel
        if: inputs.install-ipykernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Install Node dependencies
        if: steps.detect.outputs.has_node == 'true'
        run: ${{ inputs.install-command || 'npm ci' }}

      - name: Pre-build step
        if: inputs.pre-build-command != ''
        env:
          # Callers that fetch Exports artifacts/releases via `gh` need this;
          # Actions provides GITHUB_TOKEN, but the CLI looks for GH_TOKEN.
          GH_TOKEN: ${{ github.token }}
          # Local CLIs (myst, etc.) live here; raw `myst ...` build-commands need PATH.
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
        run: ${{ inputs.pre-build-command }}

      - name: Build
        env:
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
        run: ${{ inputs.build-command }}

      - name: Post-build step
        if: inputs.post-build-command != ''
        env:
          PATH: ${{ github.workspace }}/node_modules/.bin:${{ env.PATH }}
        run: ${{ inputs.post-build-command }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.output-dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
