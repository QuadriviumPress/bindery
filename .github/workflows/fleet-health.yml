# Weekly build-health check: does every active book still build with its
# catalog build recipe? Read-only -- surfaces books broken by an upstream
# dependency bump before someone notices the live site went stale.
name: Fleet build health

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.list.outputs.books }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          books="$(jq -c '[.repos[] | select(.status == "active" and .isBook == true) | {name, installCommand: .build.installCommand, buildCommand: .build.buildCommand}]' structure/repos.json)"
          echo "books=$books" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJson(needs.matrix.outputs.books) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: QuadriviumPress/${{ matrix.book.name }}
          submodules: recursive

      # LaTeX books treat a missing figure toolchain as fatal in CI.
      # EPS converters need dvisvgm; TikZ books also need pdflatex.
      # MyST and OpenStax books skip this step.
      - name: Install TeX figure tools
        if: hashFiles('scripts/convert-figures.js') != ''
        run: |
          sudo apt-get update
          if grep -q pdflatex scripts/convert-figures.js; then
            sudo apt-get install -y --no-install-recommends \
              ghostscript dvisvgm mupdf-tools lmodern texlive-font-utils \
              texlive-latex-base texlive-latex-recommended \
              texlive-fonts-recommended texlive-latex-extra texlive-pictures \
              texlive-metapost
          else
            sudo apt-get install -y --no-install-recommends \
              ghostscript dvisvgm mupdf-tools lmodern texlive-font-utils \
              texlive-binaries texlive-base
          fi
          if [ -d vendor/texmf ]; then
            mktexlsr "$PWD/vendor/texmf"
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      # Executable notebooks look up a user kernel named python3.
      - name: Register ipykernel
        if: hashFiles('requirements.txt') != ''
        run: |
          if python -c "import ipykernel" 2>/dev/null; then
            python -m ipykernel install --user --name python3 --display-name "Python 3"
          fi

      - name: Install
        run: ${{ matrix.book.installCommand }}

      # Corral Eleventy books gitignore MathJax and MiniSearch and copy them
      # from node_modules before a real deploy.
      - name: Refresh vendored front-end assets
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.['update:vendor'] ? 0 : 1)"; then
            npm run update:vendor
          else
            echo "No update:vendor script."
          fi

      - name: Build
        run: ${{ matrix.book.buildCommand }}
