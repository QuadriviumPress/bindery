# Publish docs/index.html (the QuadriviumPress book index) to
# https://quadriviumpress.github.io/bindery/. The page is pre-generated and
# committed (see bindery-selfcheck.yml), so this is a plain static deploy.
name: Deploy book index to Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - structure/repos.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
